<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Countdown to 13/02</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ff4d6d;
            --secondary: #ffb3c1;
            --bg-dark: #0f0f1a;
            --card-bg: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #1b1b3a, var(--bg-dark));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px 30px;
            max-width: 900px;
            width: 100%;
        }

        .title {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 40px;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .time-box {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 25px 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(255, 77, 109, 0.15);
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-6px) scale(1.02);
        }

        .number {
            font-size: 3rem;
            font-weight: 700;
            color: var(--secondary);
        }

        .label {
            margin-top: 6px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .message {
            font-size: 1.4rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }

        .message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .heart {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--primary);
            transform: rotate(45deg);
            animation: float 8s infinite ease-in;
            opacity: 0.4;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
        }

        .heart::before {
            top: -6px;
            left: 0;
        }

        .heart::after {
            left: -6px;
            top: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(45deg);
                opacity: 0;
            }

            20% {
                opacity: 0.4;
            }

            100% {
                transform: translateY(-20vh) rotate(45deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 class="title">Counting Down to 13/02</h1>
        <p class="subtitle">Một điều gì đó đặc biệt đang đến gần ✨</p>

        <div class="countdown">
            <div class="time-box">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="time-box">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="time-box">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="time-box">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>

        <div class="message" id="finalMessage">
            💖 It’s 13/02 — Happy Valentine’s Season 💖
        </div>
    </div>

    <script>
        const targetDate = new Date("2026-02-13T00:00:00").getTime();

        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");
        const finalMessage = document.getElementById("finalMessage");

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                daysEl.textContent = "00";
                hoursEl.textContent = "00";
                minutesEl.textContent = "00";
                secondsEl.textContent = "00";
                finalMessage.classList.add("show");
                clearInterval(timer);
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.textContent = String(days).padStart(2, "0");
            hoursEl.textContent = String(hours).padStart(2, "0");
            minutesEl.textContent = String(minutes).padStart(2, "0");
            secondsEl.textContent = String(seconds).padStart(2, "0");
        }

        const timer = setInterval(updateCountdown, 1000);
        updateCountdown();

        // Floating hearts
        for (let i = 0; i < 18; i++) {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDelay = Math.random() * 8 + "s";
            heart.style.animationDuration = 6 + Math.random() * 6 + "s";
            document.body.appendChild(heart);
        }
    </script>

</body>

</html>
